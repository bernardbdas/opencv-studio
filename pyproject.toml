[project]
name = "opencv-studio"
version = "0.1.0"
description = "OpenCV Studio: Next-gen Computer Vision, MediaPipe, Custom CUDA Kernels, and U-Net Studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "ipykernel>=7.3.0",
    "ultralytics>=8.4.115",
    "xy>=0.0.5",
    "timm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
